# Regression gates. CI fails if a metric moves the wrong side of these.
#
# The numbers are set just below current measured performance, so an unrelated
# change that quietly degrades retrieval or weakens a guard fails the build
# rather than being discovered later. They are floors to defend, not targets to
# celebrate -- and they were chosen after measuring, not before, so they are
# honest about what this system currently does.

# Correct disposition (answer / abstain / refuse) across the whole set.
min_verdict_accuracy: 0.90

# THE safety metric: answered when it should have declined. Every one of these
# is a fluent, cited, wrong answer reaching a user, so the gate is strict.
max_false_answer_rate: 0.10

# Declined when it should have answered. Costly but not dangerous, so it gets
# more headroom than false answers. An unusable system is still a failure.
max_missed_answer_rate: 0.15

# Of the figures the labelled set requires, how many appear in the answer.
min_numeric_accuracy: 0.95

# A figure that must NOT appear did (e.g. last year's rate). Zero tolerance.
max_forbidden_number_rate: 0.0

# Every claim in every answer resolves to a retrieved source.
min_citation_validity: 1.0

# Share of deliberately injected faults the guard stack blocks.
min_guard_sensitivity: 0.90
